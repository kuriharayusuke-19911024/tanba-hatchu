name: 在庫が黄色になったらLINEで発注の知らせ

on:
  # 毎週 月・木 日本時間12時ごろ（UTC 3時7分。GitHubの混雑で少し遅れることがある）。止めるときは下の2行を「#」でコメントアウト
  schedule:
    - cron: '7 3 * * 1,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テスト（1=送信せず文面の確認だけ）'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 新しく黄色になった食材を通知
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '0' }}
        run: node scripts/low_stock_line.js
