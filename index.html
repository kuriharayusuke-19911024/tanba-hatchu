function supaFetch(method,path,body){
  var opts={method:method,headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}};
  if(path.indexOf("on_conflict=")>=0)opts.headers["Prefer"]="resolution=merge-duplicates,return=minimal"; // 既存行は上書き（upsert）
  if(body)opts.body=JSON.stringify(body);
  return fetch(SUPA_URL+"/rest/v1/"+path,opts);
}

// 在庫データをSupabaseに保存（クラウドから読んだ値と違う食材だけ送る＝他端末の変更を上書きしない）
var _cloudStock={};
function saveStockToCloud(){
  var items=[];
  for(var i=0;i<STOCK.length;i++){
    var id=STOCK[i].id;
    if(_cloudStock[id]!==undefined&&Number(_cloudStock[id])===Number(STOCK[i].stock))continue;
    items.push({id:id,name:STOCK[i].n,stock:STOCK[i].stock});
    _cloudStock[id]=STOCK[i].stock;
  }
  var ps=[];
  for(var i=0;i<items.length;i++){
    (function(item){
      ps.push(supaFetch("POST","stock_items?on_conflict=id",item).then(function(r){if(!r.ok)r.text().then(function(t){console.error("Stock save error",r.status,t);});}).catch(function(e){console.error("Stock save error",e);}));
    })(items[i]);
  }
  return Promise.all(ps);
}

// 在庫データをSupabaseから読み込む
function loadStockFromCloud(callback){
  supaFetch("GET","stock_items?select=*")
    .then(function(r){return r.json();})
    .then(function(data){
      if(!Array.isArray(data)||data.length===0){if(callback)callback();return;}
      for(var i=0;i<data.length;i++){
        var row=data[i];
        for(var j=0;j<STOCK.length;j++){
          if(STOCK[j].id===row.id){
            STOCK[j].stock=Number(row.stock)||0;
            _cloudStock[row.id]=STOCK[j].stock;
            break;
          }
        }
      }
      if(callback)callback();
    })
    .catch(function(e){console.error("Stock load error",e);if(callback)callback();});
}

// 商品設定（アプリ上で追加・編集した商品）をSupabaseに保存／読込
// stock_items テーブルの id="cfg_products" 行の name 列にJSONで保存する
var PCFG={custom:[],edits:{},deleted:[],stockDeleted:[],stockCustom:[],stockMin:{}};
var CUSTOM_FIELDS=["n","u","sp","tx","co","v","temp","tempNote","lotSize","lotUnit","minLot","dispUnit","dispMult","ings","stockLink","minStock"];
function saveProductCfg(){
  supaFetch("POST","stock_items?on_conflict=id",{id:"cfg_products",name:JSON.stringify(PCFG),stock:0})
    .then(function(r){if(!r.ok)r.text().then(function(t){console.error("Product cfg save error",r.status,t);alert("商品設定の保存に失敗しました。通信状況を確認してください。");});})
    .catch(function(e){console.error("Product cfg save error",e);alert("商品設定の保存に失敗しました。");});
}
function ensureCustomStock(p){
  if(!p.stockLink)return;
  var sid="s_"+p.id;var found=null;
  for(var i=0;i<STOCK.length;i++){if(STOCK[i].id===sid){found=STOCK[i];break;}}
  if(!found){
    found={id:sid,n:p.n,type:"raw",cat:p.temp==="frozen"?"frozen":"fresh",u:p.u,stock:0,minStock:p.minStock||0,weeklyNeed:0,unitCost:0,linked:[],linkedPid:p.id,custom:true};
    STOCK.push(found);
  } else {found.n=p.n;found.u=p.u;found.minStock=p.minStock||0;found.custom=true;}
  STOCK_MAP[p.id]=[{sid:sid,qty:1}];
}
function applyProductCfg(){
  var i,j;
  for(i=0;i<PCFG.deleted.length;i++){for(j=0;j<PD.length;j++){if(PD[j].id===PCFG.deleted[i]){PD.splice(j,1);break;}}}
  var eks=Object.keys(PCFG.edits||{});
  for(i=0;i<eks.length;i++){for(j=0;j<PD.length;j++){if(PD[j].id===eks[i]){var e=PCFG.edits[eks[i]];var fk=Object.keys(e);for(var k=0;k<fk.length;k++)PD[j][fk[k]]=e[fk[k]];break;}}}
  for(i=0;i<PCFG.custom.length;i++){
    var c=PCFG.custom[i];var ex=false;
    for(j=0;j<PD.length;j++){if(PD[j].id===c.id){PD[j]=c;ex=true;break;}}
    if(!ex)PD.push(c);
    ensureCustomStock(c);
  }
  // 在庫タブで追加した食材
  for(i=0;i<PCFG.stockCustom.length;i++){
    var sc=PCFG.stockCustom[i];var found=false;
    for(j=0;j<STOCK.length;j++){if(STOCK[j].id===sc.id){STOCK[j].n=sc.n;STOCK[j].cat=sc.cat;STOCK[j].u=sc.u;STOCK[j].minStock=sc.minStock;STOCK[j].weeklyNeed=sc.weeklyNeed||0;found=true;break;}}
    if(!found)STOCK.push({id:sc.id,n:sc.n,type:"raw",cat:sc.cat,u:sc.u,stock:0,minStock:sc.minStock,weeklyNeed:sc.weeklyNeed||0,unitCost:0,linked:[],stockCustom:true});
  }
  // 発注点・週次必要数・単価の変更
  var mks=Object.keys(PCFG.stockMin||{});
  for(i=0;i<mks.length;i++){for(j=0;j<STOCK.length;j++){if(STOCK[j].id===mks[i]){var mv=PCFG.stockMin[mks[i]];if(typeof mv==="object"&&mv){if(mv.minStock!==undefined)STOCK[j].minStock=mv.minStock;if(mv.weeklyNeed!==undefined)STOCK[j].weeklyNeed=mv.weeklyNeed;if(mv.unitCost!==undefined)STOCK[j].unitCost=mv.unitCost;}else{STOCK[j].minStock=mv;}break;}}}
  // 在庫タブで削除した食材
  for(i=0;i<PCFG.stockDeleted.length;i++){for(j=0;j<STOCK.length;j++){if(STOCK[j].id===PCFG.stockDeleted[i]){STOCK.splice(j,1);break;}}}
  syncVis();
}
function loadProductCfg(callback){
  supaFetch("GET","stock_items?select=name&id=eq.cfg_products")
    .then(function(r){return r.json();})
    .then(function(data){
      if(Array.isArray(data)&&data.length&&data[0].name){
        try{var o=JSON.parse(data[0].name);PCFG={custom:o.custom||[],edits:o.edits||{},deleted:o.deleted||[],stockDeleted:o.stockDeleted||[],stockCustom:o.stockCustom||[],stockMin:o.stockMin||{}};}catch(e){console.error("Product cfg parse error",e);}
      }
      applyProductCfg();
      if(callback)callback();
    })
    .catch(function(e){console.error("Product cfg load error",e);if(callback)callback();});
}
function isCustomProd(id){for(var i=0;i<PCFG.custom.length;i++){if(PCFG.custom[i].id===id)return true;}return false;}
function recordProdEdit(p){
  if(isCustomProd(p.id)){for(var i=0;i<PCFG.custom.length;i++){if(PCFG.custom[i].id===p.id){PCFG.custom[i]=JSON.parse(JSON.stringify(p));break;}}ensureCustomStock(p);}
  else{var e={};for(var k=0;k<CUSTOM_FIELDS.length;k++){var f=CUSTOM_FIELDS[k];if(p[f]!==undefined)e[f]=JSON.parse(JSON.stringify(p[f]));}PCFG.edits[p.id]=e;}
  saveProductCfg();
}

          st:row.status,
          sl:row.photos||[],
          stockLog:row.stock_log||[]
        };
      });
      if(callback)callback();
    })
    .catch(function(e){console.error("Load error",e);if(callback)callback();});
}

// 発注をSupabaseに保存
function boxesForSave(o){var b={};var bx=o.bx||{};var ks=Object.keys(bx);for(var i=0;i<ks.length;i++)b[ks[i]]=bx[ks[i]];if(o.tanto)b._tanto=o.tanto;return b;}
function saveOrder(o,callback){
  var row={
    id:o.id,
    store:o.s,
    date:o.d,
    items:o.it,
    boxes:boxesForSave(o),
    status:o.st,
    photos:o.sl||[],
    stock_log:o.stockLog||[]
  };
  supaFetch("POST","orders?on_conflict=id",row)
    .then(function(r){
      if(r.ok){if(callback)callback();}
      else{r.json().then(function(e){console.error("Save error",e);if(callback)callback();});}
    })
    .catch(function(e){console.error("Save error",e);if(callback)callback();});
}

// 発注を更新（出荷完了・写真追加など）
function updateOrder(o,callback){
  var row={
    store:o.s,
    date:o.d,
    items:o.it,
    boxes:boxesForSave(o),
    status:o.st,
    photos:o.sl||[],
    stock_log:o.stockLog||[]
  };
  supaFetch("PATCH","orders?id=eq."+o.id,row)
    .then(function(r){if(callback)callback();})
    .catch(function(e){console.error("Update error",e);if(callback)callback();});
}

// 発注を削除（新サイクル時）

  supaFetch("DELETE","orders?id=eq."+id)

function deductStockByOrder(it){
  var alerts=[];
  var pids=Object.keys(it);
  for(var i=0;i<pids.length;i++){
    var pid=pids[i],qty=it[pid];
    var map=STOCK_MAP[pid];
    if(!map)continue;
    for(var j=0;j<map.length;j++){
      var st=getStock(map[j].sid);
      if(!st||st.noStock||st._hidden)continue;
      var use=map[j].qty*qty;
      if(map[j].batch){var cfg=getStock("cfg_gyu_packs");var per=(cfg&&cfg.stock>0)?cfg.stock:8;use=map[j].qty*qty/per;}
      st.stock=Math.round((st.stock-use)*100)/100;
      if(st.stock<0)st.stock=0;
      if(st.stock<=st.minStock){
        alerts.push({n:st.n,stock:st.stock,min:st.minStock,u:st.u,empty:st.stock<=0});
      }
    }
  }
  return alerts;
}

function deductStock(o){
  var log=[];
  var pids=Object.keys(o.it);
  for(var pi=0;pi<pids.length;pi++){
    var pid=pids[pi],qty=o.it[pid];
    var prod=null;for(var i=0;i<PD.length;i++){if(PD[i].id===pid){prod=PD[i];break;}}
    if(!prod||!prod.ings)continue;
    for(var ii=0;ii<prod.ings.length;ii++){
      var ing=prod.ings[ii],need=ing.q*qty;
      for(var si=0;si<STOCK.length;si++){
        var st=STOCK[si];
        if(st._hidden||st.type==="box")continue;
        if(!ing.n)continue;
        var hit=false;
        for(var li=0;li<st.linked.length;li++){
          if(ing.n.indexOf(st.linked[li])>=0||st.linked[li].indexOf(ing.n.split("（")[0].split("仕入")[0])>=0){hit=true;break;}
        }
        if(!hit)continue;
        // 原材料は発注時にすでに減算済みなので、ここでは記録のみ（二重減算しない）
        var dec=need;
        if(dec>0)log.push({mat:st.n,qty:dec,u:ing.u||st.u,prod:prod.n,remain:st.stock,sid:st.id});
      }
    }
  }
  if(o.bx){
    var bids=Object.keys(o.bx);
    for(var bi=0;bi<bids.length;bi++){
      var bid=bids[bi],used=o.bx[bid]||0;if(!used)continue;
      for(var si=0;si<STOCK.length;si++){
        if(STOCK[si].type==="box"&&STOCK[si].boxId===bid){
          var bef=STOCK[si].stock;STOCK[si].stock=Math.max(0,STOCK[si].stock-used);
          var dec=bef-STOCK[si].stock;
          if(dec>0)log.push({mat:STOCK[si].n,qty:dec,u:STOCK[si].u,prod:"出荷梱包",remain:STOCK[si].stock,sid:STOCK[si].id});
          break;
        }
      }
    }
  }
  if(log.length)SLOG.unshift({oid:o.id,st:o.s,d:o.d,ts:new Date().toLocaleString("ja-JP"),items:log});
  return log;
}

function calcMonthData(month,sf,rf){
  var result={};
  for(var i=0;i<ST.length;i++){
    var s=ST[i];
    if(sf&&sf!=="all"&&s!==sf)continue;
    if(rf&&rf!=="all"&&(RG[s]||"ka")!==rf)continue;
    var order=0,ship=0,cnt=0;
    for(var j=0;j<OR.length;j++){
      var o=OR[j];if(o.s!==s||o.d.indexOf(month)!==0)continue;
      var pids=Object.keys(o.it);
      for(var k=0;k<pids.length;k++){var p=null;for(var l=0;l<PD.length;l++){if(PD[l].id===pids[k]){p=PD[l];break;}}if(p)order+=p.sp*o.it[pids[k]];}
      // 米：精米代（袋ごと）＋但馬米穀出荷の送料（30kg=1袋ごと）を請求書と同じ計算で加算
      var rq=o.it["rice"]||0;
      if(rq>0){var sp2=null;for(var l=0;l<PD.length;l++){if(PD[l].id==="seimaihi"){sp2=PD[l];break;}}if(sp2)order+=sp2.sp*rq;var rs=(RICE_SHIP[RG[s]||"ka"]||1500)*rq;ship+=rs;order+=rs;}
      if(o.bx){for(var bi=0;bi<BX.length;bi++){var sc=bp(BX[bi].id,s)*(o.bx[BX[bi].id]||0);ship+=sc;order+=sc;}}
      cnt++;
    }
    result[s]={order:order,ship:ship,food:order-ship,cnt:cnt};
  }
  return result;
}
function calcProdData(month,sf,rf){
  var pd={};
  for(var i=0;i<OR.length;i++){
    var o=OR[i];if(o.d.indexOf(month)!==0)continue;
    if(sf&&sf!=="all"&&o.s!==sf)continue;
    if(rf&&rf!=="all"&&(RG[o.s]||"ka")!==rf)continue;
    var pids=Object.keys(o.it);
    for(var j=0;j<pids.length;j++){
      var pid=pids[j];if(!pd[pid])pd[pid]={qty:0,sa:0};
      var p=null;for(var k=0;k<PD.length;k++){if(PD[k].id===pid){p=PD[k];break;}}
      pd[pid].qty+=o.it[pid];pd[pid].sa+=(p?p.sp:0)*o.it[pid];
    }
  }
  return pd;
}

function toggleCheck(oid,pid,val){A.chk[oid+pid]=val;re();}
function goBoxStep(gk){A.cst[gk]="boxes";if(!A.bct[gk])A.bct[gk]={cool140:0,cool100:0,land140:0,land100:0};re();}

function setBox(gk,bid,d){if(!A.bct[gk])A.bct[gk]={cool140:0,cool100:0,land140:0,land100:0};A.bct[gk][bid]=Math.max(0,(A.bct[gk][bid]||0)+d);re();}
function markShipped(oid){
  var o=null;for(var i=0;i<OR.length;i++){if(OR[i].id===oid){o=OR[i];break;}}
  if(o){
    // 冷凍以外・冷凍の段ボールを合算して保存
    var bx={};var keys=["c","f"];
    for(var k=0;k<keys.length;k++){var bb=A.bct[oid+"_"+keys[k]]||{};var ks=Object.keys(bb);for(var i=0;i<ks.length;i++)bx[ks[i]]=(bx[ks[i]]||0)+(bb[ks[i]]||0);}
    o.st="shipped";o.bx=bx;
  }
  A.justShipped=oid;A.justShippedOrder=o;A.tab="check";re();

function doTanaoroshi(){
  var updated=[];
  for(var i=0;i<STOCK.length;i++){
    var s=STOCK[i];if(s._hidden||s.type==="box")continue;
    var el=document.getElementById("tana_"+s.id);
    if(!el||el.value==="")continue;
    var newVal=parseFloat(el.value);
    if(isNaN(newVal)||newVal<0)continue;
    var old=s.stock;
    s.stock=newVal;
    updated.push(s.n+": "+old+s.u+" → "+newVal+s.u);
  }
  if(!updated.length)return alert("入力された値がありません。変更する食材の実数を入力してください。");
  var msg="✅ 棚卸し完了！\n\n更新した食材：\n"+updated.join("\n");
  alert(msg);
  saveStockToCloud();
  re();
}

function doNyuko(){
  var vis=[];for(var i=0;i<STOCK.length;i++){if(!STOCK[i]._hidden&&STOCK[i].type!=="box")vis.push(STOCK[i]);}
  var adds=[];
  for(var i=0;i<vis.length;i++){
    var s=vis[i];
    var el=document.getElementById("nyu_"+s.id);

  }
  if(!adds.length){alert("入庫数を1つ以上入力してください");return;}
  A.modal=null;re();

    for(var i=0;i<adds.length;i++){var s=adds[i].s;var addv=s.pack?adds[i].add*s.pack:adds[i].add;s.stock=Math.round((s.stock+addv)*100)/100;updated.push(s.n+" + "+adds[i].add+(s.pack?"本":s.u)+" = "+stockDisp(s));}

  });
}

// 写真を縮小（長辺1200px・JPEG）してからデータURLにする（通信量・読込時間の削減）
function compressImage(file,cb){
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1200;var w=img.width,h=img.height;var sc=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      try{cb(c.toDataURL("image/jpeg",0.8));}catch(err){cb(e.target.result);}
    };
    img.onerror=function(){cb(e.target.result);};
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function saveEO(){
  var o=null;for(var i=0;i<OR.length;i++){if(OR[i].id===EO.oid){o=OR[i];break;}}
  if(!o)return cm();
  var nit={};var ks=Object.keys(EO.q);var has=false;
  for(var i=0;i<ks.length;i++){var v=parseInt(EO.q[ks[i]])||0;if(v>0){nit[ks[i]]=v;has=true;}}
  if(!has)return alert("1品以上残してください（発注ごと取り消す場合は丹農食品までご連絡ください）");
  // 在庫を差分で調整（増えた分を減算、減った分を戻す）
  var oldIt=o.it||{};var allK={};for(var k in oldIt)allK[k]=1;for(var k in nit)allK[k]=1;
  var dec={},inc={};
  for(var k in allK){var d=(nit[k]||0)-(oldIt[k]||0);if(d>0)dec[k]=d;else if(d<0)inc[k]=-d;}
  o.it=nit;updateOrder(o,null);cm();alert("✅ 発注内容を修正しました");
  withFreshStock(function(){
  if(Object.keys(dec).length)deductStockByOrder(dec);
  var incK=Object.keys(inc);
  for(var i=0;i<incK.length;i++){var map=STOCK_MAP[incK[i]];if(!map)continue;for(var j=0;j<map.length;j++){var st=getStock(map[j].sid);if(!st)continue;var use=map[j].qty*inc[incK[i]];if(map[j].batch){var cfg=getStock("cfg_gyu_packs");var per=(cfg&&cfg.stock>0)?cfg.stock:8;use=use/per;}st.stock=Math.round((st.stock+use)*100)/100;}}
  });
}
