function supaFetch(method,path,body){
  var opts={method:method,headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}};
  if(body)opts.body=JSON.stringify(body);

}

// 全発注データをSupabaseから読み込む
function loadOrders(callback){
  supaFetch("GET","orders?select=*&order=id.desc")
    .then(function(r){return r.json();})
    .then(function(data){
      if(!Array.isArray(data)){console.error("Load error",data);if(callback)callback();return;}
      OR=data.map(function(row){
        return{
          id:row.id,
          s:row.store,
          d:row.date,
          it:row.items||{},
          bx:row.boxes||{},
          st:row.status,
          sl:row.photos||[],
          stockLog:row.stock_log||[]
        };
      });
      if(callback)callback();
    })
    .catch(function(e){console.error("Load error",e);if(callback)callback();});
}

// 発注をSupabaseに保存
function saveOrder(o,callback){
  var row={
    id:o.id,
    store:o.s,
    date:o.d,
    items:o.it,
    boxes:o.bx||{},
    status:o.st,
    photos:o.sl||[],
    stock_log:o.stockLog||[]
  };
  supaFetch("POST","orders?on_conflict=id",row)
    .then(function(r){
      if(r.ok){if(callback)callback();}
      else{r.json().then(function(e){console.error("Save error",e);if(callback)callback();});}
    })
    .catch(function(e){console.error("Save error",e);if(callback)callback();});
}

// 発注を更新（出荷完了・写真追加など）
function updateOrder(o,callback){
  var row={
    store:o.s,
    date:o.d,
    items:o.it,
    boxes:o.bx||{},
    status:o.st,
    photos:o.sl||[],
    stock_log:o.stockLog||[]
  };
  supaFetch("PATCH","orders?id=eq."+o.id,row)
    .then(function(r){if(callback)callback();})
    .catch(function(e){console.error("Update error",e);if(callback)callback();});
}

// 発注を削除（新サイクル時）

// 在庫IDから在庫オブジェクトを取得
function getStock(sid){for(var i=0;i<STOCK.length;i++){if(STOCK[i].id===sid)return STOCK[i];}return null;}

// 発注時に在庫を減算（発注確定 = 必要量を確保）
function deductStockByOrder(it){
  var alerts=[];
  var pids=Object.keys(it);
  for(var i=0;i<pids.length;i++){
    var pid=pids[i],qty=it[pid];
    var map=STOCK_MAP[pid];
    if(!map)continue;
    for(var j=0;j<map.length;j++){
      var st=getStock(map[j].sid);
      if(!st)continue;
      var use=map[j].qty*qty;
      st.stock=Math.round((st.stock-use)*100)/100;
      if(st.stock<0)st.stock=0;
      if(st.stock<=st.minStock){
        alerts.push({n:st.n,stock:st.stock,min:st.minStock,u:st.u});
      }
    }
  }
  return alerts;
}

      alerts.push({sid:s.id,n:s.n,stock:s.stock,min:s.minStock,u:s.u,empty:s.stock<=0});
    }
  }
  return alerts;
}

function deductStock(o){

  if(o.bx){
    var bids=Object.keys(o.bx);
    for(var bi=0;bi<bids.length;bi++){
      var bid=bids[bi],used=o.bx[bid]||0;if(!used)continue;
      for(var si=0;si<STOCK.length;si++){
        if(STOCK[si].type==="box"&&STOCK[si].boxId===bid){
          var bef=STOCK[si].stock;STOCK[si].stock=Math.max(0,STOCK[si].stock-used);
          var dec=bef-STOCK[si].stock;
          if(dec>0)log.push({mat:STOCK[si].n,qty:dec,u:STOCK[si].u,prod:"出荷梱包",remain:STOCK[si].stock,sid:STOCK[si].id});
          break;
        }
      }
    }
  }
  if(log.length)SLOG.unshift({oid:o.id,st:o.s,d:o.d,ts:new Date().toLocaleString("ja-JP"),items:log});
  return log;
}

function calcMonthData(month,sf,rf){
  var result={};
  for(var i=0;i<ST.length;i++){
    var s=ST[i];
    if(sf&&sf!=="all"&&s!==sf)continue;
    if(rf&&rf!=="all"&&(RG[s]||"ka")!==rf)continue;
    var order=0,ship=0,cnt=0;
    for(var j=0;j<OR.length;j++){
      var o=OR[j];if(o.s!==s||o.d.indexOf(month)!==0)continue;
      var pids=Object.keys(o.it);
      for(var k=0;k<pids.length;k++){var p=null;for(var l=0;l<PD.length;l++){if(PD[l].id===pids[k]){p=PD[l];break;}}if(p)order+=p.sp*o.it[pids[k]];}
      if(o.bx){for(var bi=0;bi<BX.length;bi++){var sc=bp(BX[bi].id,s)*(o.bx[BX[bi].id]||0);ship+=sc;order+=sc;}}
      cnt++;
    }
    result[s]={order:order,ship:ship,food:order-ship,cnt:cnt};
  }
  return result;
}
function calcProdData(month,sf,rf){
  var pd={};
  for(var i=0;i<OR.length;i++){
    var o=OR[i];if(o.d.indexOf(month)!==0)continue;
    if(sf&&sf!=="all"&&o.s!==sf)continue;
    if(rf&&rf!=="all"&&(RG[o.s]||"ka")!==rf)continue;
    var pids=Object.keys(o.it);
    for(var j=0;j<pids.length;j++){
      var pid=pids[j];if(!pd[pid])pd[pid]={qty:0,sa:0};
      var p=null;for(var k=0;k<PD.length;k++){if(PD[k].id===pid){p=PD[k];break;}}
      pd[pid].qty+=o.it[pid];pd[pid].sa+=(p?p.sp:0)*o.it[pid];
    }
  }
  return pd;
}

function doTanaoroshi(){
  var updated=[];
  for(var i=0;i<STOCK.length;i++){
    var s=STOCK[i];if(s._hidden||s.type==="box")continue;
    var el=document.getElementById("tana_"+s.id);
    if(!el||el.value==="")continue;
    var newVal=parseFloat(el.value);
    if(isNaN(newVal)||newVal<0)continue;
    var old=s.stock;
    s.stock=newVal;
    updated.push(s.n+": "+old+s.u+" → "+newVal+s.u);
  }
  if(!updated.length)return alert("入力された値がありません。変更する食材の実数を入力してください。");
  var msg="✅ 棚卸し完了！\n\n更新した食材：\n"+updated.join("\n");
  alert(msg);
  re();
}

function procShrimp(){
  var el=document.getElementById("shrimp_proc");

  var raw=null;for(var i=0;i<STOCK.length;i++){if(STOCK[i].id==="raw_shrimp"){raw=STOCK[i];break;}}
  var proc=null;for(var i=0;i<STOCK.length;i++){if(STOCK[i].id==="proc_shrimp"){proc=STOCK[i];break;}}
  if(!raw||!proc)return alert("在庫データが見つかりません");
  if(raw.stock<cases){if(!confirm("原材料在庫("+raw.stock+"ケース)より多い数量です。続けますか？"))return;}
  raw.stock=Math.max(0,raw.stock-cases);

  SLOG.unshift({oid:"proc",st:"加工作業",d:new Date().toISOString().slice(0,10),ts:new Date().toLocaleString("ja-JP"),items:[
    {mat:"冷凍エビ（原材料）",qty:cases,u:"ケース",prod:"加工作業",remain:raw.stock,sid:raw.id},

}

function doNyuko(){
  var vis=[];for(var i=0;i<STOCK.length;i++){if(!STOCK[i]._hidden&&STOCK[i].type!=="box")vis.push(STOCK[i]);}
  var updated=[];
  for(var i=0;i<vis.length;i++){
    var s=vis[i];
    var el=document.getElementById("nyu_"+s.id);
    if(!el||el.value==="")continue;
    var add=parseFloat(el.value);
    if(isNaN(add)||add<=0)continue;
    s.stock=Math.round((s.stock+add)*100)/100;
    updated.push(s.n+" + "+add+s.u+" = "+s.stock+s.u);
  }
  if(!updated.length){alert("入庫数を1つ以上入力してください");return;}
  alert("✅ 入庫完了！\n\n" + updated.join("\n"));
  cm();
}

function doPrint(elId){
  var el=document.getElementById(elId);
  if(!el){alert("印刷する内容が見つかりません");return;}
  // すでにオーバーレイがあれば削除
  closePrintOverlay();
  var overlay=document.createElement("div");
  overlay.id="print-overlay";
  overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:9999;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px";
  var css="";var styles=document.querySelectorAll("style");
  for(var i=0;i<styles.length;i++)css+=styles[i].innerHTML;
  // ボタンは .print-hide クラスで非表示にする（buttonタグ全体を消さない）
  var backBtn='<button class="back-overlay-btn" onclick="closePrintOverlay()" style="display:block;width:100%;padding:14px;background:#374151;color:#fff;border:none;border-radius:8px;font-size:16px;margin-bottom:16px;cursor:pointer">← アプリに戻る（スワイプでも戻れます）</button>';
  var printBtn='<button class="back-overlay-btn" onclick="window.print()" style="display:block;width:100%;padding:14px;background:#1e3a6e;color:#fff;border:none;border-radius:8px;font-size:16px;margin-top:16px;margin-bottom:8px;cursor:pointer">🖨 印刷 / PDF保存</button>';
  overlay.innerHTML='<style>'+css+'@page{margin:12mm;size:A4}'
    +'@media print{.back-overlay-btn{display:none!important}.no-print{display:none!important}}'
    +'</style>'
    +backBtn+el.innerHTML+printBtn;
  document.body.appendChild(overlay);
}
function closePrintOverlay(){
  var o=document.getElementById("print-overlay");if(o)o.parentNode.removeChild(o);
}

// スワイプで戻る（左→右スワイプ）
(function(){
  var startX=0,startY=0;
  document.addEventListener("touchstart",function(e){
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener("touchend",function(e){
    var dx=e.changedTouches[0].clientX-startX;
    var dy=e.changedTouches[0].clientY-startY;
    if(dx>80&&Math.abs(dx)>Math.abs(dy)*2){
      var overlay=document.getElementById("print-overlay");
      if(overlay){closePrintOverlay();return;}
      if(TAB_HIST.length>0){A.tab=TAB_HIST.pop();re();}
    }
  },{passive:true});
})();
